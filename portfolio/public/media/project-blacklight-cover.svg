<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">BlackLight 3D — identidade visual conceitual</title><desc id="desc">Impressora 3D futurista em um estúdio violeta com peça geométrica iluminada e marca BlackLight 3D. Ilustração, não fotografia de produto.</desc>
<defs>
<radialGradient id="bg" cx="75%" cy="44%" r="85%"><stop stop-color="#38205e"/><stop offset=".54" stop-color="#140b2b"/><stop offset="1" stop-color="#05050f"/></radialGradient>
<linearGradient id="neon" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#4960ff"/><stop offset=".55" stop-color="#a544ff"/><stop offset="1" stop-color="#ff4cdf"/></linearGradient>
