<title id="t">Infraestrutura — Hefesto, Poseidon e Goiatuba</title><desc id="d">Três ícones de servidores identificados por nome e finalidade pública: aplicações, serviços de jogos e backups; ilustração sem topologia, IPs ou credenciais.</desc>
