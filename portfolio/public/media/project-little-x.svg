<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Visual editorial do Little X</title>
  <desc id="desc">Mapa abstrato de memória, ferramentas, aprovação humana e fallback local, sem representar uma tela real do projeto privado.</desc>
  <rect width="1600" height="900" fill="#0b0d12"/>
  <path d="M0 92h1600M0 808h1600" stroke="#303746"/>
  <text x="112" y="156" fill="#9db0ff" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">AGENTE PESSOAL · VISUAL EDITORIAL</text>
  <text x="108" y="340" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="132" font-weight="800" letter-spacing="-8">Little X</text>
  <text x="116" y="417" fill="#afb5c2" font-family="Arial, sans-serif" font-size="34">Contexto útil, ferramentas guardadas e decisão humana.</text>
  <g fill="none" stroke="#5272ff" stroke-width="4">
    <path d="M1010 447 830 276M1010 447 1250 250M1010 447 1285 610M1010 447 790 650"/>
    <circle cx="1010" cy="447" r="118" fill="#11151d"/><circle cx="830" cy="276" r="76" fill="#11151d"/><circle cx="1250" cy="250" r="76" fill="#11151d"/><circle cx="1285" cy="610" r="76" fill="#11151d"/><circle cx="790" cy="650" r="76" fill="#11151d"/>
  </g>
  <circle cx="1010" cy="447" r="18" fill="#9b74ff"/>
  <g fill="#f5f7fb" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="1010" y="432" font-size="28" font-weight="700">LITTLE</text><text x="1010" y="468" font-size="28" font-weight="700">X</text>
    <text x="830" y="285" font-size="21">MEMÓRIA</text><text x="1250" y="259" font-size="21">FERRAMENTAS</text><text x="1285" y="619" font-size="21">APROVAÇÃO</text><text x="790" y="659" font-size="21">FALLBACK</text>
  </g>
  <text x="112" y="782" fill="#6f7786" font-family="Arial, sans-serif" font-size="22">Projeto privado · nenhuma interface ou dado operacional é exposto</text>
</svg>
