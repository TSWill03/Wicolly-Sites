<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Little X — identidade visual conceitual</title><desc id="desc">Símbolo X luminoso em azul e violeta sobre uma plataforma tecnológica com anéis e circuitos.</desc>
