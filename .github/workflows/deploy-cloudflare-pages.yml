name: Validate and deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Test and build unified site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout event commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portfolio/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Sync public GitHub activity with cache fallback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:github

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run complete local-equivalent test suite
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_BRANCH: ${{ github.ref_name }}
        run: npm test

      - name: Check external links
        run: npm run check:links:external

      - name: Rebuild deployable artifact
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_BRANCH: ${{ github.ref_name }}
        run: npm run build

      - name: Validate deployable artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/servicos/index.html
          test -f dist/sobre/index.html
          test -f dist/projetos/index.html
          test -f dist/projetos/campus-flow/index.html
          test -f dist/projetos/veredra/index.html
          test -f dist/novidades/index.html
          test -f dist/shared/styles.css
          test -f dist/shared/site-config.js
          test -f dist/shared/navigation.js
          test -f dist/portfolio/index.html
          test -f dist/portfolio/curriculo.html
          test -f dist/portfolio/curriculo.pdf
          test -f dist/assets/projects/campus-flow.png
          test -f dist/assets/projects/veredra.png
          test -f dist/hefesto/index.html
          test -f dist/poseidon/index.html
          test -f dist/blacklight3d/index.html
          test -f dist/madrinha/index.html
          test -f dist/veredra/index.html
          test -f dist/veredra/flutter.js
          test -f dist/veredra/main.dart.js
          test -f dist/veredra/manifest.json
          test -f dist/veredra/flutter_service_worker.js
          test -f dist/version.json
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/_redirects
          test -f dist/_headers
          test -f dist/_routes.json
          node -e "const v=require('./dist/version.json'); if(v.commit!==process.env.GITHUB_SHA) process.exit(1)"

      - name: Upload tested site artifact
        uses: actions/upload-artifact@v4
        with:
          name: wicolly-site-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy main to wicolly-site
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout the exact main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify checkout provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_NAME" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked root dependencies
        run: npm ci

      - name: Download tested site artifact
        uses: actions/download-artifact@v4
        with:
          name: wicolly-site-${{ github.sha }}
          path: dist

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN is missing."; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing."; exit 1; }

      - name: Confirm official Cloudflare Pages project
        shell: bash
        run: |
          set -euo pipefail
          http_status="$(
            curl --silent --show-error \
              --output cloudflare-project-response.json \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/wicolly-site"
          )"
          test "$http_status" = "200" || { echo "::error::Could not access Cloudflare Pages project wicolly-site (HTTP $http_status)."; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const response = JSON.parse(fs.readFileSync('cloudflare-project-response.json', 'utf8'))
          const project = response.result
          if (!response.success || project?.name !== 'wicolly-site') {
            console.error('::error::Official Pages project wicolly-site was not confirmed.')
            process.exit(1)
          }
          if (project.production_branch !== 'main') {
            console.error(`::error::Unexpected production branch: ${project.production_branch}`)
            process.exit(1)
          }
          if (!project.domains?.includes('wicolly.com.br')) {
            console.error('::error::wicolly.com.br is not attached to wicolly-site.')
            process.exit(1)
          }
          console.log('Official Pages project confirmed: wicolly-site / main / wicolly.com.br')
          NODE
          rm -f cloudflare-project-response.json

      - name: Deploy tested main artifact
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name=wicolly-site \
            --branch="$GITHUB_REF_NAME" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Production ${GITHUB_SHA}"
          {
            echo "### Cloudflare Pages production"
            echo "- Project: \`wicolly-site\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Domain: https://wicolly.com.br"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the real production domain
        run: npm run smoke:production -- --base https://wicolly.com.br --commit "$GITHUB_SHA" --retries 18 --delay-ms 10000
