name: Build and update private Veredra

on:
  workflow_dispatch:
    inputs:
      veredra_ref:
        description: Veredra branch, tag or commit to publish
        required: true
        default: main
  repository_dispatch:
    types:
      - veredra-release-ready

permissions:
  contents: write

concurrency:
  group: update-veredra-private
  cancel-in-progress: false

jobs:
  build-and-update:
    name: Build private Veredra and update Wicolly-Sites
    runs-on: ubuntu-latest
    environment: production
    env:
      VEREDRA_REF: ${{ github.event.client_payload.ref || inputs.veredra_ref || 'main' }}
      SUPABASE_URL: ${{ secrets.VEREDRA_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VEREDRA_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout Wicolly-Sites main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate private build configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || {
            echo "::error::Secret VEREDRA_SUPABASE_URL is missing."
            exit 1
          }
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}" || {
            echo "::error::Secret VEREDRA_SUPABASE_PUBLISHABLE_KEY is missing."
            exit 1
          }
          case "$SUPABASE_URL" in
            https://*) ;;
            *)
              echo "::error::VEREDRA_SUPABASE_URL must use HTTPS."
              exit 1
              ;;
          esac

      - name: Checkout Veredra source
        uses: actions/checkout@v4
        with:
          repository: TSWill03/Veredra
          ref: ${{ env.VEREDRA_REF }}
          path: _veredra_source
          fetch-depth: 0

      - name: Record Veredra revision
        shell: bash
        run: |
          set -euo pipefail
          echo "VEREDRA_SHA=$(git -C _veredra_source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true

      - name: Validate Veredra source
        working-directory: _veredra_source
        run: |
          flutter pub get
          flutter analyze
          flutter test
          dart run tool/check_repository_security.dart
          dart run tool/validate_migrations.dart

      - name: Build private Veredra Web/PWA
        working-directory: _veredra_source
        shell: bash
        run: |
          set -euo pipefail
          flutter build web \
            --release \
            --base-href /veredra/ \
            --dart-define=PRIVATE_ACCESS_REQUIRED=true \
            --dart-define=PUBLIC_SIGNUP_ENABLED=false \
            --dart-define=ENABLE_GOOGLE_AUTH=false \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=AUTH_REDIRECT_URL=https://wicolly.com.br/veredra/
          dart run tool/patch_flutter_service_worker.dart
          dart run tool/validate_web_build.dart

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portfolio/package-lock.json

      - name: Install Wicolly-Sites dependencies
        run: npm ci

      - name: Replace the tracked Veredra artifact
        run: node scripts/update-veredra.mjs _veredra_source/build/web

      - name: Remove temporary source checkout
        run: rm -rf _veredra_source

      - name: Validate unified site before commit
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_BRANCH: main
        run: |
          npm test
          npm run check:links:external
          npm run build

      - name: Commit updated Veredra artifact
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- veredra; then
            echo "Veredra artifact already matches $VEREDRA_SHA."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veredra
          git commit -m "build(veredra): publish private ${VEREDRA_SHA}"
          git push origin HEAD:main

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "### Veredra private artifact"
            echo "- Source ref: \`$VEREDRA_REF\`"
            echo "- Source commit: \`$VEREDRA_SHA\`"
            echo "- Route: https://wicolly.com.br/veredra/"
            echo "- Private auth gate: enabled"
            echo "- Public signup in client: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
