# Example snippet for the existing wicolly.com.br server block.
# Keep the main site location untouched and add only these locations.

location = /blacklight3d {
    return 301 /blacklight3d/;
}

location ^~ /blacklight3d/ {
    proxy_pass http://127.0.0.1:8085/blacklight3d/;
    proxy_http_version 1.1;

    # When this Nginx is used behind wp-origin.wicolly.com.br, do not leak the
    # technical origin hostname into WordPress canonical redirects.
    proxy_set_header Host wicolly.com.br;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host wicolly.com.br;
    proxy_set_header X-Forwarded-Prefix /blacklight3d;

    proxy_set_header Connection "";

    client_max_body_size 64m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_redirect https://wp-origin.wicolly.com.br/blacklight3d/ https://wicolly.com.br/blacklight3d/;
    proxy_redirect http://wp-origin.wicolly.com.br/blacklight3d/ https://wicolly.com.br/blacklight3d/;
}
