# Example snippet for the existing wicolly.com.br server block.
# Keep the main site location untouched and add only these locations.

location = /blacklight3d {
    return 301 /blacklight3d/;
}

location ^~ /blacklight3d/ {
    proxy_pass http://127.0.0.1:8085/blacklight3d/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /blacklight3d;

    proxy_set_header Connection "";

    client_max_body_size 64m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_redirect off;
}
